AWSTemplateFormatVersion: '2010-09-09'
Description: Nginx Proxy Manager (NPM) for AWS — by Northstar Cloud Solutions. Do not expose port 81 publicly; set AdminCidr to your IP/32 or use an SSH tunnel.

Parameters:
  AmiId:
    Type: String
    Description: AMI ID for npm-hardened-edition-ubuntu22-* in this region
    AllowedPattern: '^ami-[0-9a-fA-F]+$'

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair name for SSH access

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where resources will be created

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet ID where the instance will be launched

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
    Description: Instance type (recommended: t3.small)

  AttachInstanceProfile:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Attach the optional IAM instance profile for CloudWatch/S3 backup operations.

  AssociateEip:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Allocate and associate an Elastic IP.

  RootVolumeSize:
    Type: Number
    Default: 16
    MinValue: 8
    Description: Root EBS volume size in GiB.

  RootVolumeType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
      - io1
      - io2
    Description: Root EBS volume type.

  AdminCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: CIDR allowed to reach admin ports 22/81 (set to your IP/32; do not use 0.0.0.0/0 for port 81).
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}\/([0-9]|[1-2][0-9]|3[0-2])$'

  BackupBucketName:
    Type: String
    Default: ''
    Description: Optional S3 bucket name for backups (leave empty to disable S3 permissions).

  BackupPrefix:
    Type: String
    Default: ''
    Description: Optional S3 key prefix for backups (example: npm-backups/). Leave empty for bucket-wide scope.

Conditions:
  HasBackupBucketName: !Not [!Equals [!Ref BackupBucketName, '']]
  HasBackupPrefix: !Not [!Equals [!Ref BackupPrefix, '']]
  AttachInstanceProfileEnabled: !Equals [!Ref AttachInstanceProfile, 'true']
  AssociateEipEnabled: !Equals [!Ref AssociateEip, 'true']

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NpmHardenedEditionInstancePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogsWrite
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: '*'
              - Sid: CloudWatchMetricsWrite
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
              - !If
                  - HasBackupBucketName
                  - Sid: S3BackupsWrite
                    Effect: Allow
                    Action:
                      - s3:PutObject
                      - s3:AbortMultipartUpload
                    Resource: !If
                      - HasBackupPrefix
                      - !Sub 'arn:aws:s3:::${BackupBucketName}/${BackupPrefix}*'
                      - !Sub 'arn:aws:s3:::${BackupBucketName}/*'
                  - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  NpmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nginx Proxy Manager (NPM) for AWS — allow 80/443 public; restrict 22/81 to AdminCidr
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 81
          ToPort: 81
          CidrIp: !Ref AdminCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  NpmInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref NpmSecurityGroup
      IamInstanceProfile: !If
        - AttachInstanceProfileEnabled
        - !Ref InstanceProfile
        - !Ref AWS::NoValue
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: !Ref RootVolumeType
      Tags:
        - Key: Name
          Value: npm-hardened-edition

  NpmElasticIp:
    Type: AWS::EC2::EIP
    Condition: AssociateEipEnabled
    Properties:
      Domain: vpc
      InstanceId: !Ref NpmInstance

Outputs:
  InstancePublicIP:
    Description: Public IP of the Nginx Proxy Manager (NPM) for AWS instance
    Value: !If
      - AssociateEipEnabled
      - !Ref NpmElasticIp
      - !GetAtt NpmInstance.PublicIp

  InstancePublicDNS:
    Description: Public DNS of the Nginx Proxy Manager (NPM) for AWS instance
    Value: !GetAtt NpmInstance.PublicDnsName

  NginxProxyManagerAdminURL:
    Description: Nginx Proxy Manager (NPM) for AWS admin UI URL (port 81; use SSH tunnel or allowlist a trusted IP)
    Value: !If
      - AssociateEipEnabled
      - !Sub 'http://${NpmElasticIp}:81'
      - !Sub 'http://${NpmInstance.PublicIp}:81'

  NginxProxyManagerHTTPURL:
    Description: Nginx Proxy Manager (NPM) for AWS public HTTP URL (port 80)
    Value: !If
      - AssociateEipEnabled
      - !Sub 'http://${NpmElasticIp}'
      - !Sub 'http://${NpmInstance.PublicIp}'

  NginxProxyManagerHTTPSURL:
    Description: Nginx Proxy Manager (NPM) for AWS public HTTPS URL (port 443)
    Value: !If
      - AssociateEipEnabled
      - !Sub 'https://${NpmElasticIp}'
      - !Sub 'https://${NpmInstance.PublicIp}'

  CredentialsPath:
    Description: Root-only admin credentials file path on the instance
    Value: /root/.northstar/npm-admin-credentials
